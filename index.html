<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#222222" />
    <title>Paměť Prahy — místa v čase</title>
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <header class="topbar" aria-label="Hlavička webu">
      <div class="topbar-search"><label class="visually-hidden" for="place-search">Hledat místo</label><input id="place-search" type="search" placeholder="Hledat budovu nebo místo" autocomplete="off" /></div>
      <a class="topbar-brand" href="#" aria-label="Paměť Prahy — zpět na mapu"><span class="brand-name">PAMĚŤ PRAHY</span></a>
      <nav class="topbar-nav" aria-label="Hlavní navigace">
        <button type="button" data-info="About">About</button><button type="button" data-info="Contact">Contact</button><button type="button" data-info="Image policy">Image policy</button><button type="button" data-info="Q&amp;A">Q&amp;A</button>
      </nav>
    </header>
    <main class="app-shell">
      <section class="timeline" aria-label="Procházet časovou osu">
        <div class="timeline-controls">
          <button class="round-button" id="month-back" aria-label="Předchozí datum"></button>
          <div class="month-viewport" id="month-viewport"><div class="month-track" id="month-track" role="list"></div></div>
          <button class="round-button" id="month-forward" aria-label="Následující datum"></button>
          <div class="active-month" id="active-month" aria-live="polite">2029</div>
          <span class="timeline-pointer" aria-hidden="true"></span>
        </div>
      </section>
      <section class="explore-layout" id="explore-layout" aria-label="Prozkoumat místa na mapě">
        <aside class="places-panel"><div class="places-scroll" id="places-list"></div></aside>
        <div class="map-panel"><div id="map" role="application" aria-label="Interaktivní mapa Prahy"><div class="map-fade" aria-hidden="true"></div></div><button class="map-locate" id="map-home" aria-label="Zobrazit všechna místa na mapě"></button></div>
      </section>
      <section class="place-detail" id="place-detail" hidden aria-live="polite"></section>
    </main>
    <div class="photo-lightbox" id="photo-lightbox" hidden role="dialog" aria-modal="true" aria-label="Fotografie přes celou obrazovku"><button class="photo-lightbox-close" id="photo-lightbox-close" type="button" aria-label="Zavřít fotografii"></button><button class="photo-lightbox-nav photo-lightbox-prev" id="photo-lightbox-prev" type="button" aria-label="Předchozí fotografie"></button><img id="photo-lightbox-image" alt="" /><button class="photo-lightbox-nav photo-lightbox-next" id="photo-lightbox-next" type="button" aria-label="Následující fotografie"></button></div>
    <div class="info-backdrop" id="info-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="info-title"><section class="info-panel"><button id="info-close" class="info-close" type="button" aria-label="Zavřít">×</button><h2 id="info-title"></h2><p>Informace připravujeme.</p></section></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
