<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Explore the memory of European cities through photography and time. Start with the Prague archive." />
<script>
  const previousPage = document.referrer ? new URL(document.referrer) : null;
  const returningFromCity = previousPage?.origin === location.origin && /\/(?:praha|city)(?:\.html)?$/.test(previousPage.pathname);
  const returningThroughHistory = performance.getEntriesByType('navigation')[0]?.type === 'back_forward';
  if (returningFromCity || returningThroughHistory) document.documentElement.classList.add('cities-returning');
</script>
<script>
(() => {
  const force = new URLSearchParams(location.search).get('intro');
  let seen = false;
  try { seen = sessionStorage.getItem('waa-intro-v1-seen') === '1'; } catch {}
  const returning = document.documentElement.classList.contains('cities-returning');
  window.waaShouldIntro = force === '1' || (force !== '0' && !seen && !returning && !location.hash);
  if (window.waaShouldIntro) {
    document.documentElement.classList.add('waa-intro-pending');
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#000000');
    window.waaIntroFailsafe = setTimeout(() => {
      document.documentElement.classList.remove('waa-intro-pending','waa-intro-revealing');
      const intro = document.querySelector('#waa-intro'); if (intro) intro.hidden = true;
      document.querySelectorAll('.city-header,body > main').forEach(element => { element.inert = false; });
      document.body.style.overflow = '';
    },10000);
  }
})();
</script>
  <link rel="stylesheet" href="./intro.css?v=2" />
  <link rel="preload" as="image" href="./public/images/intro/earth-blue-marble.jpg" fetchpriority="high" />
  <script src="./intro.js?v=2" defer></script>
  <title>Choose your city</title>
  <link rel="stylesheet" href="./cities.css?v=29" />
  <script>function openSavedPlace(){if(location.hash.startsWith('#place/'))location.replace('./praha.html'+location.search+location.hash)}openSavedPlace();window.addEventListener('hashchange',openSavedPlace);</script>
  <link rel="preload" as="image" href="./public/images/mission/analog-archive.png" fetchpriority="low" />
</head>
<body>
<div class="waa-intro" id="waa-intro" hidden role="dialog" aria-modal="true" aria-labelledby="waa-intro-title">
  <div class="waa-intro-veil" aria-hidden="true"></div>
  <button class="waa-intro-symbol" type="button" aria-label="Enter World Analog Archive">
    <img class="waa-intro-earth" src="./public/images/intro/earth-blue-marble.jpg" width="1881" height="1881" alt="Earth photographed by the Apollo 17 crew" fetchpriority="high" />
    <img class="waa-intro-mark" src="./city-logo.svg" width="152" height="152" alt="" aria-hidden="true" />
  </button>
  <div class="waa-intro-caption"><p>2026–2100</p><h1 id="waa-intro-title">WORLD ANALOG ARCHIVE</h1></div>
  <button class="waa-intro-skip" type="button">Skip intro <span aria-hidden="true">→</span></button>
</div>

  <header class="city-header"><div class="directory-identity"><a class="wordmark" href="./" aria-label="Home"><img class="city-logo" src="./city-logo.svg" width="112" height="112" alt="World Analog Archive" /></a><p class="directory-year">2026 - 2100</p><button class="directory-mission" type="button" data-info="Mission">Read out Memorandum for 2100</button></div><nav class="city-nav" aria-label="Main navigation"><button type="button" data-info="Mission">Memorandum</button><button type="button" data-info="Laboratory">Laboratory</button><button type="button" data-info="Contact">Contact</button><button type="button" data-info="Image policy">Image policy</button><button type="button" data-info="Q&amp;A">Q&amp;A</button></nav></header>

  <main>
<form class="directory-city-search" id="directory-city-search" role="search" autocomplete="off">
  <label class="directory-sr-only" for="directory-city-input">Search for a city</label>
  <div class="directory-city-input-row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    <input id="directory-city-input" type="search" placeholder="Search for a city" aria-controls="directory-city-results" autocapitalize="off" spellcheck="false" />
    <button type="submit" aria-label="Open matching city" disabled>→</button>
  </div>
  <ul id="directory-city-results" class="directory-city-results" hidden></ul>
  <p id="directory-city-status" class="directory-sr-only" aria-live="polite" role="status"></p>
</form>
  <section class="collections-journal" aria-labelledby="collections-journal-title">
    <header class="collections-journal-header"><h2 id="collections-journal-title">JOURNAL</h2><select id="journal-collection-filter" aria-label="Filter journal by collection"><option value="all">All collections</option></select></header>
    <div class="collections-journal-grid" id="collections-journal-grid"></div>
    <div class="collections-journal-more"><button id="journal-load-more" type="button">Load more</button><span id="journal-entry-count" aria-live="polite"></span></div>
  </section>
</main>
  <dialog class="city-info" aria-labelledby="city-info-title">
    <button class="city-info-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
    <h2 id="city-info-title"></h2><div class="city-info-body"><p>Informace připravujeme.</p></div>
  </dialog>
  <script src="./city-data.js?v=1"></script>
  <script src="./city-buildings.js?v=1"></script>
  <script src="./article-languages.js?v=1"></script>
  <script src="./journal-data.js?v=1"></script>
  <script src="./photo-credits.js?v=1"></script>
  <script src="./cities.js?v=31"></script>
</body>

</html>
