<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
<script>
  if (new URLSearchParams(location.search).has('enter')) {
    document.documentElement.classList.add('city-entering');
    const entryStarted = performance.now();
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.app-shell').inert = true;
      document.querySelector('.topbar').inert = true;
      setTimeout(() => {
        document.documentElement.classList.remove('city-entering');
        window.dispatchEvent(new Event('archive-map-visible'));
        document.querySelector('.app-shell').inert = false;
        document.querySelector('.topbar').inert = false;
        const url = new URL(location.href);
        url.searchParams.delete('enter');
        history.replaceState(null, '', url.pathname + url.search + url.hash);
      }, Math.max(0, 2000 - (performance.now() - entryStarted)));
    }, { once: true });
  }
</script>
    <title>Paměť Prahy — místa v čase</title>
    <link rel="preconnect" href="https://gs-pub.praha.eu" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css?v=54" />
</head>
<body>
  <div class="city-loading" role="status" aria-live="polite" aria-label="Načítání Prahy">
    <img src="./city-logo.svg" width="112" height="112" alt="" />
    <span lang="cs">Paměť Prahy</span>
    <span class="city-loading-progress" aria-hidden="true"></span>
  </div>

    <header class="topbar" aria-label="Hlavička webu">
      <a class="archive-home" href="./" aria-label="World Analog Archive — výběr města"><img src="./city-logo.svg" width="44" height="44" alt="World Analog Archive" /></a>
      <div class="topbar-search" id="header-search"><label class="visually-hidden" for="place-search">Search for a place</label><input id="place-search" type="search" placeholder="Search for a building or place" autocomplete="off" /></div>
      <a class="topbar-brand" href="#" aria-label="Paměť Prahy — zpět na mapu"><span class="brand-name">PAMĚŤ PRAHY</span></a>
      <nav class="topbar-nav" id="header-menu" aria-label="Hlavní navigace">
        <button class="mobile-search-toggle nav-search-toggle" type="button" aria-controls="header-search" aria-expanded="false">Search</button>
      </nav>
    </header>
    <main class="app-shell">
      <section class="timeline" aria-label="Procházet časovou osu">
        <button class="detail-back" id="detail-back" type="button" hidden aria-label="Back to the map"><span class="detail-back-label">Back to the map</span><span class="detail-back-short" aria-hidden="true">Back</span></button>
        <div class="timeline-controls">
          <button class="round-button" id="month-back" aria-label="Previous year"></button>
          <div class="month-viewport" id="month-viewport"><div class="month-track" id="month-track" role="list"></div></div>
          <button class="round-button" id="month-forward" aria-label="Next year"></button>
          <div class="active-month" id="active-month" aria-live="polite">2029</div>
          <span class="timeline-pointer" aria-hidden="true"></span>
        </div>
        <h1 class="timeline-place-title" id="detail-title" hidden></h1>
      </section>
      <section class="explore-layout" id="explore-layout" aria-label="Prozkoumat místa na mapě">
        <aside class="places-panel"><div class="places-scroll" id="places-list"></div></aside>
        <div class="map-panel"><div id="map" role="application" aria-label="Interaktivní mapa Prahy"><div class="map-fade" aria-hidden="true"></div></div><button class="map-locate" id="map-home" aria-label="Zobrazit všechna místa na mapě"></button></div>
      </section>
      <section class="place-detail" id="place-detail" hidden aria-live="polite"></section>
    </main>
    <div class="photo-lightbox" id="photo-lightbox" hidden role="dialog" aria-modal="true" aria-label="Fotografie přes celou obrazovku"><button class="photo-lightbox-close" id="photo-lightbox-close" type="button" aria-label="Zavřít fotografii"></button><button class="photo-lightbox-nav photo-lightbox-prev" id="photo-lightbox-prev" type="button" aria-label="Předchozí fotografie"></button><img id="photo-lightbox-image" alt="" /><button class="photo-lightbox-nav photo-lightbox-next" id="photo-lightbox-next" type="button" aria-label="Následující fotografie"></button></div>
    <div class="info-backdrop" id="info-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="info-title"><section class="info-panel"><button id="info-close" class="info-close" type="button" aria-label="Zavřít">×</button><h2 id="info-title"></h2><p>Informace připravujeme.</p></section></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js?v=42"></script>
  </body>
</html>
